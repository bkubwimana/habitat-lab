# @package _global_
#
# Study 2 / Study 3 configuration for Pereason + Go + Fabric (+ optional DSM).
#
# `fabric.dsm_stage` selects the DSM study stage:
#   "none"   — Study 2 (Fabric only; matches the 76.8% Fabric baseline)
#   "stage1" — Study 3 Stage 1: structured partner state as observations
#   "stage2" — Study 3 Stage 2: learned projection w/ teacher (not yet)
#   "stage3" — Study 3 Stage 3: learned recurrent DSM w/ BPTT (not yet)

defaults:
  - pereason_go
  - _self_

habitat_baselines:
  num_environments: 8
  rl:
    ppo:
      use_linear_lr_decay: True
      use_linear_clip_decay: True
      # SHARM state lives in HRL's recurrent_hidden_states slot (sourced
      # from ppo.hidden_size). 8 slots × 64 dim + 8 ages = 520 floats.
      # Default 512 is too small; 720 leaves headroom.
      hidden_size: 720
    policy:
      agent_0:
        hierarchical_policy:
          high_level_policy:
            name: "PereasonGoFabricPolicy"
            fabric:
              enabled: True
              msg_dim: 128
              num_heads: 4
              dsm_stage: "stage3"
              sharm:
                num_perception_slots: 4
                num_task_slots: 2
                num_intent_slots: 2
                slot_dim: 64
                decay_half_life: 100.0
                recon_loss_start: 1.0
                recon_loss_end: 0.0
                recon_anneal_until: 0.5
      agent_1:
        hierarchical_policy:
          high_level_policy:
            name: "PereasonGoFabricPolicy"
            fabric:
              enabled: True
              msg_dim: 128
              num_heads: 4
              dsm_stage: "stage3"
              sharm:
                num_perception_slots: 4
                num_task_slots: 2
                num_intent_slots: 2
                slot_dim: 64
                decay_half_life: 100.0
                recon_loss_start: 1.0
                recon_loss_end: 0.0
                recon_anneal_until: 0.5
