# @package _global_
#
# Study 2 / Study 3 configuration for Pereason + Go + Fabric (+ optional DSM).
#
# `fabric.dsm_stage` selects the DSM study stage:
#   "none"   — Study 2 (Fabric only; matches the 76.8% Fabric baseline)
#   "stage1" — Study 3 Stage 1: structured partner state as observations
#   "stage2" — Study 3 Stage 2: learned projection w/ teacher (not yet)
#   "stage3" — Study 3 Stage 3: learned recurrent DSM w/ BPTT (not yet)

defaults:
  - pereason_go
  - _self_

habitat_baselines:
  num_environments: 8
  rl:
    ppo:
      use_linear_lr_decay: True
      use_linear_clip_decay: True
    policy:
      agent_0:
        hierarchical_policy:
          high_level_policy:
            name: "PereasonGoFabricPolicy"
            fabric:
              enabled: True
              msg_dim: 128
              num_heads: 4
              dsm_stage: "stage1"
      agent_1:
        hierarchical_policy:
          high_level_policy:
            name: "PereasonGoFabricPolicy"
            fabric:
              enabled: True
              msg_dim: 128
              num_heads: 4
              dsm_stage: "stage1"
