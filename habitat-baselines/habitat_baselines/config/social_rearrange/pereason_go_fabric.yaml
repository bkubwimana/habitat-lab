# @package _global_
#
# Track D Phase 2: Pereason + Go + Fabric communication.

defaults:
  - pereason_go
  - _self_

habitat_baselines:
  num_environments: 8
  rl:
    ppo:
      use_linear_lr_decay: True
      use_linear_clip_decay: True
    policy:
      agent_0:
        hierarchical_policy:
          high_level_policy:
            name: "PereasonGoFabricPolicy"
            fabric:
              enabled: True
              msg_dim: 128
              num_heads: 4
              dsm_enabled: True
      agent_1:
        hierarchical_policy:
          high_level_policy:
            name: "PereasonGoFabricPolicy"
            fabric:
              enabled: True
              msg_dim: 128
              num_heads: 4
              dsm_enabled: True
